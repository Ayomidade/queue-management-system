openapi: 3.0.3
info:
  title: Cue Queue Integration API
  version: 2.0.0
  description: |
    Cue is a hosted, multi-tenant queue integration service for banks.

    There are three authentication surfaces:

    * Public guest routes under `/api/v1` do not require authentication.
    * Dashboard routes under `/api` use a JWT Bearer token.
    * Authenticated v1 routes use an `X-API-Key` header, are rate-limited per key,
      and are restricted to the key's bank and scopes.

    The public v1 guest routes are mounted before the authenticated v1 pipeline.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.example.com
    description: Production deployment
tags:
  - name: System
  - name: Auth
  - name: Users
  - name: Branches
  - name: Staff
  - name: Managers
  - name: Queues
  - name: Counters
  - name: Tickets
  - name: Analytics
  - name: Board
  - name: Kiosk
  - name: Appointments
  - name: Webhooks
  - name: Integrations
  - name: Admin
  - name: Platform
  - name: Public V1
  - name: V1
paths:
