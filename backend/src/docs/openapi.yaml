components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Dashboard JWT containing id, kind, and role claims.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Scoped bank integration key. Authenticated v1 routes also resolve a Staff identity using X-Staff-Id or the key's defaultStaffId.
  responses:
    Success:
      description: Request succeeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Created:
      description: Resource created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing, invalid, expired, or revoked credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated identity lacks the required role, bank, or scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        status: { type: string, example: success }
        message: { type: string }
        data: { nullable: true }
        meta: { type: object, nullable: true }
    ErrorEnvelope:
      type: object
      properties:
        status: { type: string, example: error }
        message: { type: string }
        errors:
          type: array
          nullable: true
          items: { type: string }
    ApiKey:
      type: object
      properties:
        id: { type: string }
        bankName: { type: string }
        label: { type: string }
        keyPrefix: { type: string }
        scopes:
          type: array
          items:
            type: string
            enum: [branches:read, tickets:read, tickets:write, staff:read, analytics:read, webhooks:manage, admin]
        rateLimit: { type: integer, example: 100 }
        isActive: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
    ApiKeyRequest:
      type: object
      properties:
        id: { type: string }
        bankName: { type: string }
        label: { type: string }
        scopes:
          type: array
          items: { type: string }
        rateLimit: { type: integer }
        status: { type: string, enum: [pending, approved, rejected] }
        canRevealKey: { type: boolean }
        keyStatus: { type: string, nullable: true, enum: [active, suspended, revoked, null] }
        keyPrefix: { type: string, nullable: true }
    Ticket:
      type: object
      properties:
        ticketId: { type: string }
        kioskId: { type: string }
        ticketNumber: { type: integer }
        status: { type: string, enum: [waiting, called, completed, skipped, cancelled] }
        guestName: { type: string }
        queue: { type: string }
        branch: { type: string }
        position: { type: integer, nullable: true }
        estimatedWaitMinutes: { type: integer, nullable: true }
    Error:
      type: object
      properties:
        status: { type: string, example: error }
        message: { type: string }
        errors:
          type: array
          items: { type: string }
