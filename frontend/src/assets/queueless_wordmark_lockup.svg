<path d="M88 80 L108 100 L108 86 M108 100 L94 100" fill="none" stroke="#f2a541" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="fill:none;stroke:rgb(242, 165, 65);color:rgb(11, 11, 11);stroke-width:8px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<text x="140" y="82" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#12294d" style="fill:rgb(18, 41, 77);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:46px;font-weight:700;text-anchor:start;dominant-baseline:auto">Queue<tspan fill="#f2a541" style="fill:rgb(242, 165, 65);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:46px;font-weight:700;text-anchor:start;dominant-baseline:auto">less</tspan></text>
